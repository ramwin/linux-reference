server {
    listen 80;
    listen [::]:80;

    root /var/www/github;

    index index.html index.htm index.nginx-debian.html README.md;

    server_name github.ramwin.com;
    gzip on;
    gzip_comp_level 9;
    gzip_types text/markdown text/html;

    # certbot webroot 续期验证(http-01)
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/letsencrypt;
        default_type "text/plain";
        access_log   off;
    }

    location / {
        gzip on;
        gzip_comp_level 9;
        try_files $uri $uri/ =404;
        autoindex on;
    }
}

# ── 443: TLS 终结 ─────────────────────────────────────────────────────
# 复用 linux-reference.ramwin.com 的证书(SAN 同时覆盖 github.ramwin.com)。
# 缺这一段时 HTTPS 请求掉进 443 默认 server,证书名称不匹配。
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name github.ramwin.com;

    ssl_certificate     /etc/letsencrypt/live/linux-reference.ramwin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linux-reference.ramwin.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:LINUXREF:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/github;
    index index.html index.htm index.nginx-debian.html README.md;

    gzip on;
    gzip_comp_level 9;
    gzip_types text/markdown text/html;

    location / {
        gzip on;
        gzip_comp_level 9;
        try_files $uri $uri/ =404;
        autoindex on;
    }
}
