server {
    listen 80;
    listen [::]:80;

    root /var/www/github/linux-reference/_build/html;

    index index.html index.htm index.nginx-debian.html README.md;

    server_name linux-reference.ramwin.com;
    gzip on;
    gzip_comp_level 9;
    gzip_types text/markdown text/html;

    location / {
        gzip on;
        gzip_comp_level 9;
        try_files $uri $uri/ =404;
        autoindex on;
    }
}

# ── 443: TLS 终结 ─────────────────────────────────────────────────────
# 证书由 certbot 签发/续期(nginx installer),同一张证书的 SAN 同时覆盖
# linux-reference.ramwin.com 与 github.ramwin.com,所以 github.conf 复用同一份证书。
# 缺这一段时请求会掉进 443 默认 server(docs.xuyuanyuan),浏览器报证书名称不匹配。
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name linux-reference.ramwin.com;

    ssl_certificate     /etc/letsencrypt/live/linux-reference.ramwin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linux-reference.ramwin.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:LINUXREF:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/github/linux-reference/_build/html;
    index index.html index.htm index.nginx-debian.html README.md;

    gzip on;
    gzip_comp_level 9;
    gzip_types text/markdown text/html;

    location / {
        gzip on;
        gzip_comp_level 9;
        try_files $uri $uri/ =404;
        autoindex on;
    }
}
